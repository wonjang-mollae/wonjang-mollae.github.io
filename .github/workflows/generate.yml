name: 콘텐츠 생성 (월~금 07:37/08:13/08:43/09:13/09:53/11:43 KST — 재시도 슬롯)
on:
  schedule:
    - cron: '37 22 * * 0-4'   # 월~금 07:37 KST (1차)
    - cron: '13 23 * * 0-4'   # 월~금 08:13 KST (2차 — 1차 skip 대비)
    - cron: '43 23 * * 0-4'   # 월~금 08:43 KST (3차)
    - cron: '13 0 * * 1-5'    # 월~금 09:13 KST (4차 — 크론 지연·미발화 대비)
    - cron: '53 0 * * 1-5'    # 월~금 09:53 KST (5차)
    - cron: '43 2 * * 1-5'    # 월~금 11:43 KST (6차 — 최종, 12:43 게시 슬롯 전)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 오늘자 생성 여부 확인 (중복 방지)
        id: guard
        run: |
          TODAY=$(TZ=Asia/Seoul date +%Y-%m-%d)
          if [ -d "posts/$TODAY" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "오늘자(posts/$TODAY) 이미 생성됨 — 종료"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip == 'false'
        with: { node-version: 20 }
      - name: 한글 폰트 + ffmpeg 설치
        if: steps.guard.outputs.skip == 'false'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra ffmpeg
      - name: 콘텐츠 생성 (Claude API)
        if: steps.guard.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node generate.js
      - name: 카드 렌더링
        if: steps.guard.outputs.skip == 'false'
        run: |
          POST_DIR=$(cat .last_post_dir)
          CHROME_BIN=$(which google-chrome) node make_cards.js "$POST_DIR/post.json" "$POST_DIR"
          rm -f "$POST_DIR"/card*.html
      - name: 릴스 렌더링
        if: steps.guard.outputs.skip == 'false'
        run: |
          POST_DIR=$(cat .last_post_dir)
          CHROME_BIN=$(which google-chrome) node make_reel.js "$POST_DIR/post.json" "$POST_DIR"
          rm -f "$POST_DIR"/frame*.png
      - name: 커밋
        if: steps.guard.outputs.skip == 'false'
        run: |
          git config user.name "mollae-bot"
          git config user.email "actions@github.com"
          git add -A && git commit -m "자동 생성: $(cat .last_post_dir)" && git push
      - name: 승인 이슈 생성 (거부권)
        if: steps.guard.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = fs.readFileSync('.last_post_dir','utf8').trim();
            const post = JSON.parse(fs.readFileSync(`${dir}/post.json`,'utf8'));
            const base = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/${dir}`;
            const cards = fs.readdirSync(dir).filter(f=>/^card\d+\.png$/.test(f)).sort();
            const imgs = cards.map(c=>`![${c}](${base}/${c})`).join('\n');
            const caption = fs.readFileSync(`${dir}/caption.txt`,'utf8');
            const reel = fs.existsSync(`${dir}/reel.mp4`) ? `\n\n🎬 **릴스 미리보기**: [reel.mp4 보기](${base}/reel.mp4) (카드와 함께 자동 게시됨)` : '';
            await github.rest.issues.create({
              ...context.repo,
              title: `[발행 예고] ${post.series} ${post.issueNo} — 오늘 10:00 무인 발행`,
              labels: ['publish-queue'],
              body: `**무인 발행** — 오늘 10:00(KST)에 자동 게시됩니다. 멈추려면 그 전에 이 이슈에 \`stop\` 댓글을 남기세요.\n\n${imgs}${reel}\n\n---\n**캡션**\n\`\`\`\n${caption}\n\`\`\``
            });

  # GitHub 크론 미발화 대비: 생성 워크플로우가 직접 10:07 KST까지 대기 후 게시를 트리거
  # 2026-09-28: generate 완료 뒤에만 실행(needs) — 콘텐츠 커밋 전에 게시가 먼저 돌아 헛돌던 문제 방지
  trigger-publish:
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      actions: write
    concurrency:
      group: publish-sleeper
      cancel-in-progress: true
    steps:
      - name: 10:07 KST까지 대기 후 publish.yml 디스패치
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KDATE=$(TZ=Asia/Seoul date +%F)
          TARGET=$(date -u -d "${KDATE} 01:07:00" +%s)
          NOW=$(date -u +%s)
          WAIT=$((TARGET - NOW))
          if [ "$WAIT" -gt 0 ] && [ "$WAIT" -lt 18000 ]; then
            echo "게시 시각(10:07 KST)까지 ${WAIT}초 대기"
            sleep "$WAIT"
          else
            echo "대기 없이 즉시 트리거 (WAIT=${WAIT})"
          fi
          curl -sf -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "publish.yml 디스패치 완료"
